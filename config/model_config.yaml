prediction_config:
  timesteps: 168 # 144
  steps_ahead: 144
  decomposition_levels: 3
  number_of_classes: 4

data_split:
  validation: 5000 # size of test set For 1h 8000, 10 min 15000
  test: 5000 # size of test set For 1h 8000, 10 min 15000
  trial: 2000 # size of trial min 1000 max 5000

# General Training Configuration
training:
  n_trials: 200 # 200
  retest_trials: 10
  trial_epochs: 10 #10
  final_epochs: 100
  trial_patience: 3 #3
  final_patience: 10
  batch_size_options: [64, 128, 256]
  random_seed: 42

hyperparameter_lag:
    keep_frac: [ 0.02, 0.6, 0.02]
    decay_lag: 3.0
    incentive_feat: 0.5 # (0,1)
    span_frac: 0.2

# Model Architecture Parameters
model_sizes:
  extra_small:
    units: [8, 32, 8]      # [min, max, step]
  small:
    units: [32, 64, 16]
  medium:
    units: [64, 128, 32]
  large:
    units: [128, 256, 64] # max may be 256

# Optimizer Configuration
optimizer:
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-8

# Hyperparameter Search Space
hyperparameter_space:
  ini_learning_rate: [1.0e-5, 1.0e-2]  # [min, max] in log scale
  dropout_rate: {min: 0.0, max: 0.2, step: 0.02}
  weight_decay: {min: 1.0e-7, max: 1.0e-4}  # [min, max]
  model_sizes: ['small', 'medium', 'large'] #category 'extra_small',
  kernel_sizes: [2, 8]  # [min, max] for CNN models # heads tft
  head_sizes: [2, 8]  # [min, max] for CNN models # heads tft
  latent_dim_t: [32, 256, 32] #min max step
  latent_dim_s: [128, 256, 32] #min max step

lr_schedule:
  anneal_strategy: 'cos'
  min_lr_factor:  0.05

optuna:
  pruner:
    startup_trials: 5   # let first
    warmup_steps:  3
    s_startup_trials: 5   # let first
    s_warmup_steps: 3



